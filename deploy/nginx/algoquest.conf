limit_req_zone $binary_remote_addr zone=judge_submit:10m rate=2r/s;

server {
    listen 80;
    server_name game.intqwq.com;

    location = /api/judge/v1/submissions {
        limit_req zone=judge_submit burst=4 nodelay;
        client_max_body_size 70k;
        proxy_pass http://127.0.0.1:8788/v1/submissions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /api/judge/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Replace this upstream with the frontend container/service in the full stack.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
