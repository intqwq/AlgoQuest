name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@v4.37.3
        with:
          output: codeql-results
          # This private repository does not currently have GitHub Code Scanning
          # enabled. Keep running the complete analysis and retain its SARIF until
          # repository settings allow direct security-events uploads.
          upload: never
      - name: Retain CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: error
          retention-days: 14
