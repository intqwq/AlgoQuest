name: Finalize Turnstile hardening

on:
  push:
    branches:
      - agent/judge-turnstile-reliability

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/judge-turnstile-reliability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply server hardening
        run: python scripts/apply-turnstile-server-hardening.py

      - name: Install web dependencies
        run: npm ci

      - name: Lint, build and test Web
        run: |
          npm run lint
          npm test

      - name: Install and test Core API
        run: |
          npm --prefix services/api ci
          npm --prefix services/api test

      - name: Test Judge queue and quest data
        run: npm --prefix judge test

      - name: Validate Compose model
        run: docker compose --env-file .env.windows.example --profile all config --quiet

      - name: Build and test isolated Judge runner
        run: |
          docker build -f judge/Dockerfile.runner -t algoquest-runner:cpp14 judge
          JUDGE_DOCKER_TEST=1 npm --prefix judge test

      - name: Create validated final commit
        id: final
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-turnstile-server-hardening.py
          rm -f .github/workflows/finalize-turnstile-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Turnstile reliability hardening'
          final_commit="$(git rev-parse HEAD)"
          echo "sha=$final_commit" >> "$GITHUB_OUTPUT"
          echo "FINAL_COMMIT=$final_commit"

      - name: Upload commit object for connector publication
        continue-on-error: true
        run: git push origin HEAD:agent/judge-turnstile-reliability

      - name: Report validated commit
        run: echo "Validated final commit ${{ steps.final.outputs.sha }}"
