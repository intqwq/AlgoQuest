name: Required CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-ci:
    name: required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: algoquest_test
          POSTGRES_USER: algoquest
          POSTGRES_PASSWORD: algoquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U algoquest -d algoquest_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Lint, build and test Web
        run: |
          npm run lint
          npm test

      - name: Browser end-to-end test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Install and test Core API
        env:
          TEST_DATABASE_URL: postgres://algoquest:algoquest@127.0.0.1:5432/algoquest_test
        run: |
          npm --prefix services/api ci
          npm --prefix services/api test

      - name: Test Judge queue and quest data
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          npm --prefix judge ci
          npm --prefix judge test

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix services/api audit --omit=dev --audit-level=high
          npm --prefix judge audit --omit=dev --audit-level=high

      - name: Validate Compose model
        run: docker compose --env-file .env.windows.example --profile all config --quiet

      - name: Build and test isolated Judge runner
        run: |
          docker build -f judge/Dockerfile.runner -t algoquest-runner:cpp14 judge
          JUDGE_DOCKER_TEST=1 npm --prefix judge test

      - name: Test the Compose Judge API, queue and worker path
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --env-file .env.windows.example --profile judge down --remove-orphans
          }
          trap cleanup EXIT
          docker compose --env-file .env.windows.example --profile judge up -d --build judge judge-worker redis
          if ! docker compose --env-file .env.windows.example exec -T judge node scripts/smoke.mjs; then
            docker compose --env-file .env.windows.example logs --tail 150 judge judge-worker redis
            exit 1
          fi
