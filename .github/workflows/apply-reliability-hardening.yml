name: Apply reliability hardening

on:
  push:
    branches:
      - agent/judge-turnstile-reliability
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/judge-turnstile-reliability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .reliability-patch/part-* | base64 --decode > /tmp/reliability-patch.tgz
          echo 'b92e12fc5817ddf221fdf7393cfd2d2e7045734d2cb2cbc78c8193b28d7701ad  /tmp/reliability-patch.tgz' | sha256sum --check
          tar -xzf /tmp/reliability-patch.tgz
          python - <<'PY'
          from pathlib import Path

          docker_runner = Path('judge/src/docker-runner.mjs')
          text = docker_runner.read_text(encoding='utf-8')
          replacements = [
              (
                  '      "run",\n      "--name",',
                  '      "run",\n      "--interactive",\n      "--name",',
              ),
              (
                  '  const runnerJobDir = WORK_VOLUME\n'
                  '    ? `/judge-data/jobs/${path.basename(jobDir)}`\n'
                  '    : "/submission";\n'
                  '  const jobMount = WORK_VOLUME\n'
                  '    ? `type=volume,src=${WORK_VOLUME},dst=/judge-data`\n'
                  '    : `type=bind,src=${jobDir},dst=/submission`;\n',
                  '  let hostJobDir = jobDir;\n'
                  '  if (WORK_VOLUME) {\n'
                  '    const volumeInspection = await docker([\n'
                  '      "volume",\n'
                  '      "inspect",\n'
                  '      WORK_VOLUME,\n'
                  '      "--format",\n'
                  '      "{{.Mountpoint}}",\n'
                  '    ]);\n'
                  '    const mountpoint = volumeInspection.stdout.trim();\n'
                  '    if (volumeInspection.code !== 0 || !mountpoint) {\n'
                  '      throw new Error(`Cannot resolve Judge work volume ${WORK_VOLUME}`);\n'
                  '    }\n'
                  '    hostJobDir = path.join(mountpoint, "jobs", path.basename(jobDir));\n'
                  '  }\n'
                  '  const runnerJobDir = "/submission";\n'
                  '  const jobMount = `type=bind,src=${hostJobDir},dst=/submission,readonly`;\n'
                  '  const exportMount = `type=bind,src=${path.join(hostJobDir, "export")},dst=/export`;\n',
              ),
              (
                  '      "--mount",\n      jobMount,\n      IMAGE,',
                  '      "--mount",\n      jobMount,\n      "--mount",\n      exportMount,\n      IMAGE,',
              ),
              (
                  '  const binaryPath = path.join(jobDir, "main");\n'
                  '  const cachedBinary = path.join(CACHE_ROOT, cacheKey(source));',
                  '  const binaryPath = path.join(jobDir, "main");\n'
                  '  const exportDir = path.join(jobDir, "export");\n'
                  '  const exportedBinary = path.join(exportDir, "main");\n'
                  '  const cachedBinary = path.join(CACHE_ROOT, cacheKey(source));',
              ),
              (
                  '  await chmod(jobDir, 0o755);\n'
                  '  await writeFile(sourcePath, source, { mode: 0o644 });\n'
                  '  if (cacheHit) {',
                  '  await chmod(jobDir, 0o755);\n'
                  '  await mkdir(exportDir, { mode: 0o700 });\n'
                  '  await chmod(exportDir, 0o700);\n'
                  '  await writeFile(sourcePath, source, { mode: 0o444 });\n'
                  '  if (cacheHit) {',
              ),
              (
                  '      (await fileExists(binaryPath))\n'
                  '    ) {\n'
                  '      await storeCache(binaryPath, cachedBinary);',
                  '      (await fileExists(exportedBinary))\n'
                  '    ) {\n'
                  '      await storeCache(exportedBinary, cachedBinary);',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Docker runner patch anchor not found: {old[:60]!r}')
              text = text.replace(old, new, 1)
          docker_runner.write_text(text, encoding='utf-8')

          supervisor = Path('judge/runner/submission_runner.py')
          text = supervisor.read_text(encoding='utf-8')
          replacements = [
              (
                  'COMPILED_BINARY_PATH = COMPILE_ROOT / "main"\n',
                  'COMPILED_BINARY_PATH = COMPILE_ROOT / "main"\n'
                  'EXPORT_BINARY_PATH = Path("/export/main")\n',
              ),
              (
                  '    payload = sys.stdin.buffer.read(MAX_MANIFEST_BYTES + 1)\n'
                  '    sys.stdin.close()\n',
                  '    payload = sys.stdin.buffer.read(MAX_MANIFEST_BYTES + 1)\n'
                  '    sys.stdin.close()\n'
                  '    # Keep fd 0 occupied by /dev/null. Otherwise subprocess pipe creation can\n'
                  '    # reuse descriptor 0, allowing contestant code to read hidden case input\n'
                  '    # through /proc/1/fd/0.\n'
                  '    devnull_fd = os.open(os.devnull, os.O_RDONLY)\n'
                  '    if devnull_fd != 0:\n'
                  '        os.dup2(devnull_fd, 0)\n'
                  '        os.close(devnull_fd)\n',
              ),
              (
                  '    if manifest["cacheHit"] and BINARY_PATH.exists():\n'
                  '        os.chmod(BINARY_PATH, 0o555)\n'
                  '        os.chmod(SUBMISSION_ROOT, 0o755)\n'
                  '        return None\n',
                  '    if manifest["cacheHit"] and BINARY_PATH.exists():\n'
                  '        # The host materializes cached binaries read-only before the container\n'
                  '        # starts. Do not mutate the read-only contestant mount.\n'
                  '        return None\n',
              ),
              (
                  '    # The compiler runs as the unprivileged submission user. Copying the\n'
                  '    # finished executable from the scratch tmpfs creates a root-owned file\n'
                  '    # without granting CAP_CHOWN to the container supervisor.\n'
                  '    shutil.copyfile(COMPILED_BINARY_PATH, BINARY_PATH)\n'
                  '    os.chmod(BINARY_PATH, 0o555)\n'
                  '    os.chmod(SUBMISSION_ROOT, 0o755)\n'
                  '    return None\n',
                  '    # Keep the compiler-owned executable inside the isolated /work tmpfs while\n'
                  '    # contestant code is running. Cache export happens only after all cases.\n'
                  '    return None\n',
              ),
              (
                  '        str(BINARY_PATH),\n    ]\n    memory_bytes',
                  '        str(BINARY_PATH if manifest["cacheHit"] else COMPILED_BINARY_PATH),\n'
                  '    ]\n    memory_bytes',
              ),
              (
                  '    if compile_failure is not None:\n'
                  '        emit({"type": "result", **compile_failure})\n'
                  '        return\n',
                  '    if compile_failure is not None:\n'
                  '        emit({"type": "result", **compile_failure, "containerStarts": 1})\n'
                  '        return\n',
              ),
              (
                  '    emit(\n        {\n            "type": "result",\n',
                  '    if not manifest["cacheHit"]:\n'
                  '        # /export is a separate root-only mount. Contestant UID 10001 cannot\n'
                  '        # write to it, so the cached binary cannot be poisoned by submitted code.\n'
                  '        shutil.copyfile(COMPILED_BINARY_PATH, EXPORT_BINARY_PATH)\n'
                  '        os.chmod(EXPORT_BINARY_PATH, 0o555)\n\n'
                  '    emit(\n        {\n            "type": "result",\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Supervisor patch anchor not found: {old[:60]!r}')
              text = text.replace(old, new, 1)
          supervisor.write_text(text, encoding='utf-8')

          docker_test = Path('judge/test/docker.integration.test.mjs')
          text = docker_test.read_text(encoding='utf-8')
          old = '  bool exposed = ifstream("/submission/manifest.json").good();\n'
          new = (
              '  bool exposed = ifstream("/submission/manifest.json").good();\n'
              '  exposed = exposed || ofstream("/submission/contestant-write-probe").good();\n'
              '  exposed = exposed || ofstream("/export/contestant-write-probe").good();\n'
          )
          if old not in text:
              raise SystemExit('Docker security test patch anchor not found')
          docker_test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install web dependencies
        run: npm ci

      - name: Lint, build and test Web
        run: |
          npm run lint
          npm test

      - name: Install and test Core API
        run: |
          npm --prefix services/api ci
          npm --prefix services/api test

      - name: Test Judge queue and quest data
        run: npm --prefix judge test

      - name: Validate Compose model
        run: docker compose --env-file .env.windows.example --profile all config --quiet

      - name: Build and test isolated Judge runner
        run: |
          docker build -f judge/Dockerfile.runner -t algoquest-runner:cpp14 judge
          JUDGE_DOCKER_TEST=1 npm --prefix judge test

      - name: Commit validated source
        shell: bash
        run: |
          rm -rf .reliability-patch .github/workflows/apply-reliability-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Judge isolation and account verification'
          git push origin HEAD:agent/judge-turnstile-reliability
