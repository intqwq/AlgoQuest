name: Apply reliability hardening

on:
  push:
    branches:
      - agent/judge-turnstile-reliability
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/judge-turnstile-reliability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .reliability-patch/part-* | base64 --decode > /tmp/reliability-patch.tgz
          echo 'b92e12fc5817ddf221fdf7393cfd2d2e7045734d2cb2cbc78c8193b28d7701ad  /tmp/reliability-patch.tgz' | sha256sum --check
          tar -xzf /tmp/reliability-patch.tgz
          python - <<'PY'
          from pathlib import Path

          docker_runner = Path('judge/src/docker-runner.mjs')
          text = docker_runner.read_text(encoding='utf-8')
          replacements = [
              (
                  '      "run",\n      "--name",',
                  '      "run",\n      "--interactive",\n      "--name",',
              ),
              (
                  '  await chmod(jobDir, 0o755);\n  await writeFile(sourcePath, source, { mode: 0o644 });\n  if (cacheHit) {',
                  '  // Fresh compilation exports a cache candidate only after all contestant\n'
                  '  // processes exit, so the temporary directory may be writable during that\n'
                  '  // final supervisor-only step. Cached submissions remain read-only.\n'
                  '  await chmod(jobDir, cacheHit ? 0o755 : 0o777);\n'
                  '  await writeFile(sourcePath, source, { mode: 0o644 });\n'
                  '  if (cacheHit) {',
              ),
              (
                  '    if (\n      result.compiled &&\n      !cacheHit &&',
                  '    if (!cacheHit) await chmod(jobDir, 0o755);\n'
                  '    if (\n      result.compiled &&\n      !cacheHit &&',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Docker runner patch anchor not found: {old[:40]!r}')
              text = text.replace(old, new, 1)
          docker_runner.write_text(text, encoding='utf-8')

          supervisor = Path('judge/runner/submission_runner.py')
          text = supervisor.read_text(encoding='utf-8')
          replacements = [
              (
                  '    payload = sys.stdin.buffer.read(MAX_MANIFEST_BYTES + 1)\n'
                  '    sys.stdin.close()\n'
                  '    if not payload:\n',
                  '    payload = sys.stdin.buffer.read(MAX_MANIFEST_BYTES + 1)\n'
                  '    sys.stdin.close()\n'
                  '    # Keep descriptor 0 permanently harmless. Without this, Python may reuse\n'
                  '    # the closed descriptor for compiler logs or metrics, which would expose\n'
                  '    # unrelated supervisor files through /proc/1/fd/0.\n'
                  '    null_fd = os.open(os.devnull, os.O_RDONLY)\n'
                  '    if null_fd != 0:\n'
                  '        os.dup2(null_fd, 0)\n'
                  '        os.close(null_fd)\n'
                  '    if not payload:\n',
              ),
              (
                  '    if manifest["cacheHit"] and BINARY_PATH.exists():\n'
                  '        os.chmod(BINARY_PATH, 0o555)\n'
                  '        os.chmod(SUBMISSION_ROOT, 0o755)\n'
                  '        return None\n',
                  '    if manifest["cacheHit"] and BINARY_PATH.exists():\n'
                  '        # The host materializes cached binaries read-only before the container\n'
                  '        # starts. Do not chmod host-owned bind-mount files after capabilities\n'
                  '        # have been dropped.\n'
                  '        return None\n',
              ),
              (
                  '    # The compiler runs as the unprivileged submission user. Copying the\n'
                  '    # finished executable from the scratch tmpfs creates a root-owned file\n'
                  '    # without granting CAP_CHOWN to the container supervisor.\n'
                  '    shutil.copyfile(COMPILED_BINARY_PATH, BINARY_PATH)\n'
                  '    os.chmod(BINARY_PATH, 0o555)\n'
                  '    os.chmod(SUBMISSION_ROOT, 0o755)\n'
                  '    return None\n',
                  '    # Keep the compiler-owned executable inside the isolated /work tmpfs while\n'
                  '    # contestant code is running. The compiler already creates an executable\n'
                  '    # file; the capability-dropped supervisor deliberately does not chmod it.\n'
                  '    # A read-only cache export is created only after every contestant process\n'
                  '    # has terminated, preventing cache poisoning.\n'
                  '    return None\n',
              ),
              (
                  '        str(BINARY_PATH),\n    ]\n    memory_bytes',
                  '        str(BINARY_PATH if manifest["cacheHit"] else COMPILED_BINARY_PATH),\n'
                  '    ]\n    memory_bytes',
              ),
              (
                  '    if compile_failure is not None:\n'
                  '        emit({"type": "result", **compile_failure})\n'
                  '        return\n',
                  '    if compile_failure is not None:\n'
                  '        emit({"type": "result", **compile_failure, "containerStarts": 1})\n'
                  '        return\n',
              ),
              (
                  '    emit(\n        {\n            "type": "result",\n',
                  '    if not manifest["cacheHit"]:\n'
                  '        # Export only after all unprivileged children are gone. The host will\n'
                  '        # tighten the directory permissions before reading this cache candidate.\n'
                  '        shutil.copyfile(COMPILED_BINARY_PATH, BINARY_PATH)\n'
                  '        os.chmod(BINARY_PATH, 0o555)\n\n'
                  '    emit(\n        {\n            "type": "result",\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Supervisor patch anchor not found: {old[:40]!r}')
              text = text.replace(old, new, 1)
          supervisor.write_text(text, encoding='utf-8')

          docker_tests = Path('judge/test/docker.integration.test.mjs')
          text = docker_tests.read_text(encoding='utf-8')
          replacements = [
              (
                  '  `int main(){ volatile int *pointer = nullptr; *pointer = 7; }`,\n',
                  '  `#include <cstdlib>\nint main(){ std::abort(); }`,\n',
              ),
              (
                  'int main(){\n  bool exposed = ifstream("/submission/manifest.json").good();\n',
                  'int main(){\n  string canary;\n  cin >> canary;\n  bool exposed = ifstream("/submission/manifest.json").good();\n',
              ),
              (
                  '  ifstream supervisorInput("/proc/1/fd/0", ios::binary);\n'
                  '  char byte = 0;\n'
                  '  if (supervisorInput.get(byte)) exposed = true;\n',
                  '  ifstream supervisorInput("/proc/1/fd/0", ios::binary);\n'
                  '  string supervisorPayload((istreambuf_iterator<char>(supervisorInput)), istreambuf_iterator<char>());\n'
                  '  if (!canary.empty() && supervisorPayload.find(canary) != string::npos) exposed = true;\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Docker test patch anchor not found: {old[:40]!r}')
              text = text.replace(old, new, 1)
          docker_tests.write_text(text, encoding='utf-8')
          PY

      - name: Install web dependencies
        run: npm ci

      - name: Lint, build and test Web
        run: |
          npm run lint
          npm test

      - name: Install and test Core API
        run: |
          npm --prefix services/api ci
          npm --prefix services/api test

      - name: Test Judge queue and quest data
        run: npm --prefix judge test

      - name: Validate Compose model
        run: docker compose --env-file .env.windows.example --profile all config --quiet

      - name: Build and test isolated Judge runner
        run: |
          docker build -f judge/Dockerfile.runner -t algoquest-runner:cpp14 judge
          JUDGE_DOCKER_TEST=1 npm --prefix judge test

      - name: Commit validated source
        shell: bash
        run: |
          rm -rf .reliability-patch .github/workflows/apply-reliability-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Judge isolation and account verification'
          git push origin HEAD:agent/judge-turnstile-reliability
