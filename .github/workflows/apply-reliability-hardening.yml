name: Apply reliability hardening

on:
  push:
    branches:
      - agent/judge-turnstile-reliability
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/judge-turnstile-reliability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .reliability-patch/part-* | base64 --decode > /tmp/reliability-patch.tgz
          echo 'b92e12fc5817ddf221fdf7393cfd2d2e7045734d2cb2cbc78c8193b28d7701ad  /tmp/reliability-patch.tgz' | sha256sum --check
          tar -xzf /tmp/reliability-patch.tgz
          python - <<'PY'
          from pathlib import Path

          path = Path('judge/src/docker-runner.mjs')
          text = path.read_text(encoding='utf-8')
          old = '      "run",\n      "--name",'
          new = '      "run",\n      "--interactive",\n      "--name",'
          if old not in text:
              raise SystemExit('Docker run argument anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install web dependencies
        run: npm ci

      - name: Lint, build and test Web
        run: |
          npm run lint
          npm test

      - name: Install and test Core API
        run: |
          npm --prefix services/api ci
          npm --prefix services/api test

      - name: Test Judge queue and quest data
        run: npm --prefix judge test

      - name: Validate Compose model
        run: docker compose --env-file .env.windows.example --profile all config --quiet

      - name: Build and test isolated Judge runner
        run: |
          docker build -f judge/Dockerfile.runner -t algoquest-runner:cpp14 judge
          JUDGE_DOCKER_TEST=1 npm --prefix judge test

      - name: Commit validated source
        shell: bash
        run: |
          rm -rf .reliability-patch .github/workflows/apply-reliability-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Judge isolation and account verification'
          git push origin HEAD:agent/judge-turnstile-reliability
