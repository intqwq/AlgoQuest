name: Apply codebase cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  issue_comment:
    types:
      - created

permissions:
  contents: write

jobs:
  apply:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'agent/codebase-cleanup-20260802') ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 18 && github.event.comment.body == '/apply-cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codebase-cleanup-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore exact generated files
        run: |
          cat scripts/.generated-parts/part-* > /tmp/generated.tar.gz.b64
          echo "ea4259d8f1427f0554a4cd19656174f08cef9affc074db9d6e08bf96701ba0f3  /tmp/generated.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/generated.tar.gz.b64 > /tmp/generated.tar.gz
          echo "9844c62a39ce4d9299863a82952a834717f790569e19b1a907cedd364030df6e  /tmp/generated.tar.gz" | sha256sum -c -
          tar -xzf /tmp/generated.tar.gz -C .
      - name: Repair and apply cleanup
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/codebase-cleanup.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const start = source.indexOf('const generatedFiles = ');
          const marker = ';\n\nfunction resolve';
          const end = source.indexOf(marker, start);
          if (start < 0 || end < 0) throw new Error('generatedFiles block not found');
          source = source.slice(0, start) + 'const generatedFiles = {}' + source.slice(end + 1);
          fs.writeFileSync(file, source);
          NODE
          node --check scripts/codebase-cleanup.mjs
          node scripts/codebase-cleanup.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit a clean single-change branch
        run: |
          rm -rf scripts/codebase-cleanup.mjs scripts/.cleanup-parts scripts/.generated-parts scripts/.cleanup-trigger .github/workflows/apply-codebase-cleanup.yml
          git reset --soft 6104675648cfe32bdc0b4d8ecadc6a6aa30a0f48
          git config user.name "AlgoQuest Cleanup Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refactor runtime, OJ, profiles, and migrations"
          git push --force origin HEAD:agent/codebase-cleanup-20260802
